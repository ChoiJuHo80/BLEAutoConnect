name: Build iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App (Unsigned)
      run: |
        xcodebuild -project BLEAutoConnect.xcodeproj \
                   -scheme BLEAutoConnect \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   clean build

    - name: Package as IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/BLEAutoConnect.app Payload/
        zip -r BLEAutoConnect.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BLEAutoConnect-IPA
        path: BLEAutoConnect.ipa
